[project]
name = "my-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.33.0",
    "fastapi>=0.165.0",
    "langchain>=1.4.3",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.7",
    "langfuse>=4.16.0",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.2.1",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "psycopg[binary,pool]>=3.3.9",
    "python-dotenv>=1.2.3",
    "trustcall==0.0.39",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
